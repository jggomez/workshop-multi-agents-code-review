[project]
name = "mcp-server-github"
version = "0.1.0"
description = "FastMCP GitHub Server"
authors = [
    { name = "jggomez" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.28.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.30.0",
]

[project.scripts]
mcp-server-github = "mcp_server_github.__main__:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests connecting to real MCP server / GitHub API",
]

